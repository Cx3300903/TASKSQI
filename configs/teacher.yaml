seed: 42
device: auto
data:
  shhs_npz: data/shhs_c4a1_125hz_epochs.npz
  split_dir: splits_official_like
  normalize: subject
  input_samples: 3750
teacher:
  num_classes: 5
  architecture: official_shhs
  batch_size: 128
  epochs: 50
  patience: 8
  lr: 0.0001
  weight_decay: 0.0001
  mixed_precision: false
  grad_clip_norm: 1.0
  resume: null
outputs:
  checkpoint: outputs/checkpoints/teacher.pt
  table: outputs/tables/teacher_performance.csv
  log_dir: outputs/logs
