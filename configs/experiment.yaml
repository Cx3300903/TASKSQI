seed: 42
device: auto
data:
  shhs_npz: data/shhs_c4a1_125hz_epochs.npz
  hospital_npz: data/hospital_c4a1_125hz_epochs.npz
  split_dir: splits_official_like
  normalize: subject
  input_samples: 3750
  hospital_input_samples: 3750
teacher:
  checkpoint: outputs/checkpoints/teacher.pt
  architecture: official_shhs
tasksqi:
  checkpoint: outputs/checkpoints/tasksqi_retention.pt
  ablation_checkpoints:
    severity: outputs/checkpoints/tasksqi_severity.pt
    binary_flip: outputs/checkpoints/tasksqi_binary_flip.pt
    js: outputs/checkpoints/tasksqi_js.pt
    retention: outputs/checkpoints/tasksqi_retention.pt
eval:
  batch_size: 128
  n_boot: 1000
  coverages: [1.0, 0.95, 0.9, 0.85, 0.8, 0.7]
  seen_trials_per_epoch: 1
  clipping_k: [3.0, 2.0, 1.0, 0.5]
outputs:
  log_dir: outputs/logs
  teacher_table: outputs/tables/teacher_performance.csv
  main_table: outputs/tables/main_results.csv
  ablation_table: outputs/tables/target_ablation.csv
  stagewise_table: outputs/tables/stagewise_results.csv
  shhs_rc_figure: outputs/figures/risk_coverage_shhs
  hospital_rc_figure: outputs/figures/risk_coverage_hospital
  corruption_curve_figure: outputs/figures/corruption_quality_curve
